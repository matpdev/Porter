<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      display: inline-block;
    }
    #card {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 28px 32px;
      min-width: 760px;
      max-width: 1120px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .title {
      color: #e6edf3;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }
    #diagram {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #diagram svg {
      max-width: 100%;
      height: auto;
    }
    .footer {
      margin-top: 16px;
      text-align: right;
      color: #6e7681;
      font-size: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="card">
    <div class="title" id="card-title"></div>
    <div id="diagram"></div>
    <div class="footer">sidequestlab.dev</div>
  </div>
  <script src="/assets/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: "dark",
      securityLevel: "loose",
      flowchart: { useMaxWidth: false, htmlLabels: true }
    });
    window.renderDiagram = async function(payload) {
      document.getElementById("card-title").textContent = payload.title || "Architecture";
      try {
        const { svg } = await mermaid.render("mermaid-svg", payload.content);
        document.getElementById("diagram").innerHTML = svg;
      } catch (err) {
        window.__RENDER_ERROR = err && err.message ? err.message : String(err);
      }
      window.__RENDER_READY = true;
    };
  </script>
</body>
</html>
